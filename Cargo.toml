# containerd-shimkit, cut down and extended for a shim whose containers run in a VM: see KOEDODB.md. A start from containerd/runwasi
# (Apache-2.0). The dependency versions are those of the upstream workspace at 5a8fc8e9, written out because this is a crate of its own.
[package]
name = "containerd-shimkit"
description = "A small library for building containerd shims whose containers run elsewhere"
version = "0.1.2-koedodb.2"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/KoedoDB/containerd-shimkit"
repository = "https://github.com/KoedoDB/containerd-shimkit"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
containerd-shim = "0.11"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
libc = "0.2"
log = "0.4"
oci-spec = { version = "0.9.0", default-features = false, features = ["runtime"] }
protobuf = "3.7"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
trait-variant = "0.1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-async-drop = "0.1"
